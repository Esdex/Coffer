name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The [FAQ and troubleshooting](https://esdex.github.io/Coffer/faq.html) page may already have the answer.
        **Do not report security vulnerabilities here:** use [GitHub Security Advisories](https://github.com/Esdex/Coffer/security/advisories/new) instead.
        **Never include passwords, recovery words, file names or your phone number**, here or in logs and screenshots.

  - type: input
    id: version
    attributes:
      label: Coffer version
      description: Settings, About. Filled in when you report from the app.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version & device
      description: Filled in when you report from the app.
      placeholder: "e.g. Android 14, Google Pixel 8"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Where did you get Coffer?
      options:
        - GitHub Releases
        - F-Droid
        - Google Play
        - Obtainium
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: premium
    attributes:
      label: Telegram Premium
      description: Without it Telegram limits download speed, which matters for slow transfers.
      options:
        - "No"
        - "Yes"
        - Don't know
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Tap '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: If applicable. Do not include passwords, recovery words, file names or your phone number.
