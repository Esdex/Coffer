name: Feature Request
description: Suggest an improvement or new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, check if a similar one already exists.
        Changes to the encryption, the vault format or sync need extra scrutiny: describe your use case clearly.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or limitation you're running into.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? How should it work?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Vault, unlock and recovery key
        - Files and folders
        - Viewers (photos, videos, music, PDF, text)
        - Transfers and the cache
        - Several devices and sync
        - Telegram sign-in
        - Security
        - UI and settings
        - Other
    validations:
      required: true
